name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    # QOS-0023: an invalid workflow file fails with zero jobs and no log. Lint every workflow on every PR.
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "actionlint-py==1.7.12.25"
      - run: actionlint .github/workflows/*.yml

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      QUEEN_DISABLE_KEYRING: "1"
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers the ARM64 Linux target (Thelio Astra / Ampere Altra), QOS-0011.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -m "not live" --ignore=tests/live
      - name: CLI smoke (real hive, real chain)
        shell: bash
        run: |
          queen init "$RUNNER_TEMP/hive" --node-id ci_${{ matrix.python }}
          queen ledger verify "$RUNNER_TEMP/hive"
          queen ledger tail "$RUNNER_TEMP/hive" -n 1
          queen host probe --hive "$RUNNER_TEMP/hive"
          queen ledger verify "$RUNNER_TEMP/hive"

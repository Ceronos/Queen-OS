name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest
      - name: CLI smoke (real hive, real chain)
        shell: bash
        run: |
          queen init "$RUNNER_TEMP/hive" --node-id ci_${{ matrix.python }}
          queen ledger verify "$RUNNER_TEMP/hive"
          queen ledger tail "$RUNNER_TEMP/hive" -n 1

  live-ollama:
    # Real local inference with no keys: Ollama + a 0.5B model, run in a *production* hive.
    name: live / ollama (real local model)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          if ! curl -sf http://127.0.0.1:11434/api/version; then
            (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          fi
          ollama pull "$LIVE_MODEL"
      - name: Install Queen-OS
        run: python -m pip install -e ".[dev]"
      - name: Live witnessed inference
        env:
          QUEEN_LIVE_TARGETS: ollama=${{ env.LIVE_MODEL }}
        run: pytest -m live -rs -s tests/live
      - name: CLI witnessed inference
        run: |
          queen init "$RUNNER_TEMP/hive" --node-id live_ollama
          queen infer ollama "$LIVE_MODEL" "Say hello in three words." --hive "$RUNNER_TEMP/hive" --max-tokens 24
          queen ledger verify "$RUNNER_TEMP/hive"
          queen ledger tail "$RUNNER_TEMP/hive" -n 1

  live-api:
    # Hosted APIs. Keys exist only as GitHub encrypted secrets: never in the repo, never in
    # logs (GitHub masks them), and never available to fork PRs. A missing secret means the
    # job is skipped and reported as skipped, never passed.
    name: live / hosted APIs (encrypted secrets)
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUEEN_LIVE_TARGETS: >-
        anthropic=${{ vars.QUEEN_LIVE_ANTHROPIC_MODEL || 'claude-haiku-5-5' }},openai=${{ vars.QUEEN_LIVE_OPENAI_MODEL || 'gpt-5-mini' }},gemini=${{ vars.QUEEN_LIVE_GEMINI_MODEL || 'gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Live witnessed inference (providers without a secret are reported SKIPPED)
        run: pytest -m live -rs -s tests/live
